[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-firewall-linux"
version = "0.1.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Linux firewall for Liminal: ufw, firewalld or nftables on a Linux machine or in a WSL distribution, on, the framework's pages kept to the machine, the ports its services need opened as Liminal's own rules."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.1)
dependencies = ["liminal-libs>=1.20.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
firewall-linux = "plugin_platform_firewall_linux"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
